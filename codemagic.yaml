workflows:
  android-debug:
    name: Mandalay Smart Map - Android Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Configure Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Download Gradle 8.9
        script: |
          curl -fL --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle-8.9-bin.zip
          unzip -q /tmp/gradle-8.9-bin.zip -d /tmp
      - name: Build native Android debug APK
        script: /tmp/gradle-8.9/bin/gradle --no-daemon --stacktrace :app:assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
